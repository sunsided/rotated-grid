name: Release

# Runs when `cargo release` pushes a version tag, e.g. `0.3.0`.
on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+*" ]

permissions: {}

# Never cancel a release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: read
      id-token: write # Trusted publishing to crates.io.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check that the tag matches the crate version
      run: |
        version="$(cargo metadata --no-deps --format-version 1 \
          | jq -r '.packages[] | select(.name == "rotated-grid") | .version')"
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match crate version $version"
          exit 1
        fi
    - name: Run tests
      run: cargo test -p rotated-grid
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
    - name: Publish
      run: cargo publish -p rotated-grid
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Extract release notes from the changelog
      run: |
        awk -v version="$GITHUB_REF_NAME" '
          index($0, "## [" version "]") == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "::error::No CHANGELOG.md section for $GITHUB_REF_NAME"
          exit 1
        fi
    - name: Create release
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --verify-tag \
          --title "$GITHUB_REF_NAME" \
          --notes-file release-notes.md
      env:
        GH_TOKEN: ${{ github.token }}
