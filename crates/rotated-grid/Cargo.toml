[package]
name = "rotated-grid"
description = "Rotated grid calculations for CMYK halftone dithering and more"
version = "0.2.0"
edition = "2021"
keywords = ["halftone", "image-processing", "grid"]
categories = ["multimedia::images", "mathematics"]
repository = "https://github.com/sunsided/rotated-grid"
license = "EUPL-1.2"
readme = "../../README.md"
rust-version = "1.59"

[lib]
# The unit tests run with `cargo test`; this keeps `cargo bench` from listing them as ignored.
bench = false

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "benchmark"
harness = false

[package.metadata.release]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: https://github.com/sunsided/rotated-grid/compare/.*?\\.\\.\\.HEAD", replace = "[Unreleased]: https://github.com/sunsided/rotated-grid/compare/{{version}}...HEAD\n[{{version}}]: https://github.com/sunsided/rotated-grid/releases/tag/{{version}}", exactly = 1 },
]
